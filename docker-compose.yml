services:
  deepseek-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 基础镜像与 npm 源；国内默认走 npmmirror，可用 .env 覆盖
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: deepseek-web-self:latest
    container_name: deepseek-web
    restart: unless-stopped
    # 不向宿主机暴露任何端口：由 nginx 通过共享 docker 网络访问 http://deepseek-web:3080
    expose:
      - "3080"
    networks:
      - web-net
    # 需要在本机直连调试时，取消下面两行注释（仅本机可访问）：
    # ports:
    #   - "127.0.0.1:3081:3080"
    environment:
      PORT: "3080"
      DATA_DIR: "/data"
      TZ: "Asia/Shanghai"
      # 用于加密用户绑定的 API Key；不填则首次启动自动生成并保存在 /data/app-secret
      APP_SECRET: ${APP_SECRET:-}
      # 服务器默认 API Key：账号没绑定自己的 Key 时使用（适合一个人付费、几个人共用）
      DEFAULT_DEEPSEEK_API_KEY: ${DEFAULT_DEEPSEEK_API_KEY:-}
      # 注册控制
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      REGISTER_INVITE_CODE: ${REGISTER_INVITE_CODE:-}
      # 登录态有效天数
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # 反向代理终止 TLS 时必须为 true：Cookie 带 Secure、并信任代理取真实 IP
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # 调试：设为 1 时打印每个 API 请求的耗时与大小
      LOG_REQUESTS: ${LOG_REQUESTS:-}
    volumes:
      # 全部数据（SQLite 数据库、附件原件、自动生成的密钥）都在这里，备份只需拷贝该目录
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # 与 nginx（或其它反代容器）共用的外部网络，需提前创建一次：
  #   docker network create web-net
  web-net:
    external: true
